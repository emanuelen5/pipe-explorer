[package]
name = "pipe-explorer"
version = "0.1.0"
edition = "2024"
description = "A TUI application for visually building and inspecting shell pipe commands"

[dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
sha2 = "0.10"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
bytecount = "0.6.9"

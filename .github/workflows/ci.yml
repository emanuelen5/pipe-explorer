name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  build-linux:
    name: Build binary (x86_64-unknown-linux-musl)
    uses: ./.github/workflows/build-binary.yml
    with:
      os: ubuntu-latest
      target: x86_64-unknown-linux-musl
      archive: tar.gz
  
  resolve-build:
    runs-on: ubuntu-latest
    outputs:
      build-others: ${{ steps.resolve.outputs.build-others }}
    steps:
      - name: Resolve if we should build other platforms
        id: resolve
        env: 
          LABEL_SET: ${{ contains(github.event.pull_request.labels, 'ci-build-all') && 'true' || 'false' }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ env.LABEL_SET }}" = "false" ]; then
            echo "Not building other platforms for this PR."
            echo "build-others=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building other platforms for this PR."
            echo "build-others=true" >> "$GITHUB_OUTPUT"
          fi

  build-macos-arm:
    name: Build binary (aarch64-apple-darwin)
    needs: resolve-build
    if: needs.resolve-build.outputs.build-others == 'true'
    uses: ./.github/workflows/build-binary.yml
    with:
      os: macos-latest
      target: aarch64-apple-darwin
      archive: tar.gz

  build-macos-intel:
    name: Build binary (x86_64-apple-darwin)
    needs: resolve-build
    if: needs.resolve-build.outputs.build-others == 'true'
    uses: ./.github/workflows/build-binary.yml
    with:
      os: macos-latest
      target: x86_64-apple-darwin
      archive: tar.gz

  build-windows:
    name: Build binary (x86_64-pc-windows-msvc)
    needs: resolve-build
    if: needs.resolve-build.outputs.build-others == 'true'
    uses: ./.github/workflows/build-binary.yml
    with:
      os: windows-latest
      target: x86_64-pc-windows-msvc
      archive: zip

  release-nightly:
    name: Release Nightly
    needs: [build-linux, build-macos-arm, build-macos-intel, build-windows]
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build-linux.result == 'success' &&
      needs.build-macos-arm.result == 'success' &&
      needs.build-macos-intel.result == 'success' &&
      needs.build-windows.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing nightly release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --yes --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create nightly \
            --repo "${{ github.repository }}" \
            --prerelease \
            --title "Nightly Build" \
            --notes "Automated nightly build from commit ${{ github.sha }} on \`main\`." \
            artifacts/*
